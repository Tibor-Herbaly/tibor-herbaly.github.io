<div *ngIf="page" class="card mx-auto mt-4" style="max-width: 400px;">
  <div class="card-body text-center">
    <h5 class="card-title">{{ page.title }}</h5>

    <p>(Jelenleg nem működik !)</p>

    <p class="card-text">
      Átlagos értékelés:
      <span class="badge bg-primary">{{ page.averageRating | number:'1.1-1' }}</span>
    </p>

    <p class="text-muted">
      Értékelések száma: {{ page.ratingCount }} |
      Összeg: {{ page.ratingSum }} Az értékelések összege
    </p>

    <div class="mb-3">
      <label for="rating" class="form-label">Értékelés (1 (rossz) – 6 (jök jó))</label>
      <select id="rating" class="form-select" [(ngModel)]="selectedValue">
        <option *ngFor="let v of [1,2,3,4,5,6]" [value]="v">{{ v }}</option>
      </select>
    </div>

    <button class="btn btn-success" (click)="ratePage()">Küldés</button>
  </div>
</div>
<hr>
