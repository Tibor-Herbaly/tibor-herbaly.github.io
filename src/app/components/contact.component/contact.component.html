<div class="container mt-4">
  <h2>Kapcsolat (Sajnos jelenleg nem működik !)</h2>
  <h6>( A * -ggal megjelölt mezők kitöltése kötelező !)</h6>
  <form (ngSubmit)="onSubmit()" #contactForm="ngForm" novalidate>

    <div class="mb-3">
      <label for="name" class="form-label">Név *</label>
      <input type="text" id="name" class="form-control" [(ngModel)]="form.name" name="name" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">E-mail *</label>
      <input type="email" id="email" class="form-control" [(ngModel)]="form.email" name="email" required>
    </div>

    <div class="mb-3">
      <label for="subject" class="form-label">Tárgy *</label>
      <input type="text" id="subject" class="form-control" [(ngModel)]="form.subject" name="subject" required>
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Telefon</label>
      <input type="text" id="phone" class="form-control" [(ngModel)]="form.phone" name="phone">
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Üzenet *</label>
      <textarea id="message" class="form-control" rows="5" [(ngModel)]="form.message" name="message" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Küldés</button>
    <p>Megnyomás után kérem várjon 3 mp -et !</p>
  </form>

  <!-- Üzenetablak -->
  <div *ngIf="statusMessage" class="mt-3">
    <div class="alert"
         [ngClass]="statusColor === 'green' ? 'alert-success' : 'alert-danger'"
         role="alert">
      {{ statusMessage }}
    </div>
  </div>
</div>
