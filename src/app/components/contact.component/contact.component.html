<div class="container mt-4">
  <h2>Kapcsolat (Sajnos jelenleg nem működik !)</h2>
  <h6>( A * -ggal megjelölt mezők kitöltése kötelező !)</h6>
  <form (ngSubmit)="onSubmit()" #contactForm="ngForm" novalidate>

    <div class="mb-3">
      <label for="name" class="form-label">Név *</label>
      <input type="text" id="name" class="form-control" [(ngModel)]="form.name" name="name" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">E-mail *</label>
      <input type="email" id="email" class="form-control" [(ngModel)]="form.email" name="email" required>
    </div>

    <div class="mb-3">
      <label for="subject" class="form-label">Tárgy *</label>
      <input type="text" id="subject" class="form-control" [(ngModel)]="form.subject" name="subject" required>
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Telefon</label>
      <input type="text" id="phone" class="form-control" [(ngModel)]="form.phone" name="phone">
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Üzenet *</label>
      <textarea id="message" class="form-control" rows="5" [(ngModel)]="form.message" name="message" required></textarea>
    </div>

    <section class="captcha mb-3" aria-labelledby="captcha-title">
      <h3 id="captcha-title" class="captcha__title">Számpár captcha</h3>
      <p><b>{{ captchaInstruction }}</b></p>
      <div class="captcha-pairs" aria-label="CAPTCHA számpárok">
        <span *ngFor="let pair of captchaPairs; let i = index">
          {{ i + 1 }}. <strong>{{ pair }}</strong>
        </span>
      </div>
      <div class="captcha-answers">
        <input
          type="text"
          class="form-control"
          [(ngModel)]="captchaFirst"
          name="captchaFirst"
          placeholder="Első számpár"
          required
          maxlength="2"
          pattern="[0-9]{2}"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Első kért számpár"
        >
        <input
          type="text"
          class="form-control"
          [(ngModel)]="captchaSecond"
          name="captchaSecond"
          placeholder="Második számpár"
          required
          maxlength="2"
          pattern="[0-9]{2}"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Második kért számpár"
        >
      </div>
      <button
        type="button"
        class="btn btn-outline-secondary mt-2"
        (click)="loadCaptcha()"
        [disabled]="captchaLoading"
      >
        {{ captchaLoading ? 'Captcha betöltése...' : '🔄 Új kérdés' }}
      </button>
    </section>

    <button type="submit" class="btn btn-primary" [disabled]="!captchaLoaded || captchaLoading">
      Küldés
    </button>
    <p>Megnyomás után kérem várjon 3 mp -et !</p>
  </form>

  <!-- Üzenetablak -->
  <div *ngIf="statusMessage" class="mt-3">
    <div class="alert"
         [ngClass]="statusColor === 'green' ? 'alert-success' : 'alert-danger'"
         role="alert">
      {{ statusMessage }}
    </div>
  </div>
</div>
