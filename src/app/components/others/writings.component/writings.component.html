<main class="writings">
  <header class="writings__header">
    <p class="writings__eyebrow">Írások</p>
    <h1>Gondolatok és történetek</h1>
    <p class="writings__intro">Olvasnivalók és történetek.</p>
  </header>

  <p *ngIf="loading" role="status">Az írások betöltése...</p>
  <p *ngIf="errorMessage" class="writings__error" role="alert">{{ errorMessage }}</p>
  <p *ngIf="!loading && writings.length === 0 && !errorMessage">
    Még nem jelent meg írás.
  </p>

  <section *ngIf="!loading && writings.length > 0" class="writing-grid" aria-label="Bejegyzések">
    <button *ngFor="let writing of writings" class="writing-card" type="button"
            (click)="openWriting(writing)" [attr.aria-label]="'Írás megnyitása: ' + writing.title">
      <img *ngIf="writing.coverImage" class="writing-card__image"
           [src]="writing.coverImage" [alt]="writing.title" loading="lazy">
      <span class="writing-card__number">{{ writing.publishedDate | date:'yyyy. MM. dd.':'UTC' }}</span>
      <span class="writing-card__title">{{ writing.title }}</span>
      <span class="writing-card__excerpt">{{ writing.excerpt }}</span>
      <span class="writing-card__hint">Elolvasom <span aria-hidden="true">→</span></span>
    </button>
  </section>

  <p *ngIf="detailLoading" role="status">Az írás betöltése...</p>
  <article *ngIf="selectedWriting" class="writing-detail" aria-live="polite">
    <header class="writing-detail__header">
      <div>
        <p class="writings__eyebrow">{{ selectedWriting.publishedDate | date:'yyyy. MM. dd.':'UTC' }}</p>
        <h2>{{ selectedWriting.title }}</h2>
        <p class="writing-detail__excerpt">{{ selectedWriting.excerpt }}</p>
      </div>
      <button class="writing-detail__close" type="button" (click)="closeWriting()">Vissza</button>
    </header>
    <div class="writing-detail__content" [innerHTML]="selectedWriting.contentHtml"></div>
  </article>
</main>
