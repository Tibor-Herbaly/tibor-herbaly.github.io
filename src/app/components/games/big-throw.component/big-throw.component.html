<div class="container mt-3">
  <h3> Dobókocka játék – „Nagyobbat dobni” </h3>

  <div #chatDiv class="chat-box border p-3 mb-3 bg-light"
       style="height: 400px; overflow-y: auto; border-radius: 8px;">
    <div *ngFor="let u of uzenetek">
      <span [ngClass]="u.szin">{{ u.szoveg }}</span>
    </div>
  </div>

  <div class="mb-3">
    <button class="btn btn-primary me-2"
            (click)="dobas()"
            [disabled]="jatekVege">
      🎲 Dobás
    </button>
    <button class="btn btn-success"
            (click)="ujJatek()">
      🔄 Új játék
    </button>
  </div>

  <p><strong>Állás:</strong> Te: {{ userWins }} – Számítógép: {{ computerWins }}</p>
</div>
